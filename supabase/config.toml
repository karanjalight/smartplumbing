# Mali Smart — Supabase project config
# Run `supabase start` for a local stack, `supabase db reset` to apply
# migrations + seed against the local Postgres, and `supabase db push` to
# deploy migrations to the linked hosted project.

project_id = "smartone"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/clients/dashboard",
  "http://localhost:3000/landlords/dashboard",
  "http://localhost:3000/dashboard",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

# Realtime is required for the in-app notification panel.
[realtime]
enabled = true
